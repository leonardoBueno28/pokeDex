<div
  class="pokemon-card"
  [class.selected]="selected"
  [ngStyle]="{ 'background-color': pokemon.color }"
>
  <div class="pokemon-image">
    <img [src]="pokemon.sprites.front_default" alt="{{ pokemon.name }}" />
  </div>
  <div class="pokemon-name">#{{ pokemon.id }} {{ pokemon.name }}</div>
</div>
